name: Handoff

# A handoff brief is only useful if it is true. The parts of HANDOFF.md that go
# stale -- main's tip and the open pull requests with their CI verdict -- are
# generated here rather than maintained by hand, and published as this job's
# summary rather than committed.
#
# Committing them is what this workflow used to do, and it only ever worked
# because it targeted `develop`, whose ruleset requires no pull request. Against
# a protected trunk every attempt is refused -- "Changes must be made through a
# pull request" -- so the choice was to hole the trunk's protection for a
# generated file, or to stop writing the file. Derived state does not need to be
# in the tree.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Nothing is written, so concurrent runs cannot conflict; the newest answer is
# the only one worth having.
concurrency:
  group: handoff
  cancel-in-progress: true

# Read-only. The write token this workflow used to need is gone with the commit.
permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  regenerate:
    name: Refresh the handoff status block
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # main by name, not the repository's default branch: the two were the
      # same only by coincidence, and the default is still `develop`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Publish the status block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Handoff status"
            echo
            echo "Paste this into the generated block of \`HANDOFF.md\`, or run"
            echo "\`scripts/gen-handoff-status.sh --in-place\` locally to splice it in."
            echo
            scripts/gen-handoff-status.sh
          } >> "$GITHUB_STEP_SUMMARY"
