name: Handoff

# A handoff brief is only useful if it is true. The parts of HANDOFF.md that go
# stale -- main's tip and the open pull requests with their CI verdict -- are
# regenerated here rather than maintained by hand.
on:
  push:
    branches: [ main, develop ]
  # Open, close or retarget a pull request and the table is wrong until the next
  # push to the default branch, which may be days away.
  pull_request_target:
    types: [ opened, closed, reopened, ready_for_review, converted_to_draft ]
  workflow_dispatch:

# One writer at a time, and no cancelling a run mid-push: two concurrent runs
# committing to the default branch is how this workflow would start failing on rejected
# pushes.
concurrency:
  group: handoff
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  regenerate:
    name: Refresh the handoff status block
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the default branch: on a pull_request_target event the ref is the
      # base, but being explicit keeps the commit target unambiguous.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          # fetch-depth: 0 ensures retry rebases have full commit history.
          fetch-depth: 0

      - name: Regenerate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/gen-handoff-status.sh

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- HANDOFF.md; then
            echo "Status block already current; nothing to commit."
            exit 0
          fi

          TARGET_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # CONTRIBUTING.md requires a sign-off on every contribution. CI only
          # enforces it on pull requests, but a commit landing on the default branch without
          # one would be the first, so it carries the bot's own.
          git commit -s -m 'docs: refresh the handoff status block' \
            -m "Generated by scripts/gen-handoff-status.sh from the state of ${TARGET_BRANCH} and the open pull requests." \
            -- HANDOFF.md

          # Losing the race to a concurrent push is ordinary here, not a
          # failure: rebase onto whatever landed and try again.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/${TARGET_BRANCH}."
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}" || { git rebase --abort; exit 1; }
            sleep $(( 2 ** attempt ))
          done
          echo "::error::Could not push the refreshed handoff after 4 attempts."
          exit 1
