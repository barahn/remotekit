name: Handoff

# A handoff brief is only useful if it is true. The parts of HANDOFF.md that go
# stale -- main's tip and the open pull requests with their CI verdict -- are
# regenerated here rather than maintained by hand.
on:
  push:
    branches: [ main, develop ]
  # Open, close or retarget a pull request and the table is wrong until the next
  # push to the default branch, which may be days away.
  pull_request_target:
    types: [ opened, closed, reopened, ready_for_review, converted_to_draft ]
  workflow_dispatch:

# One writer at a time, and no cancelling a run mid-push: two concurrent runs
# committing to the default branch is how this workflow would start failing on rejected
# pushes.
concurrency:
  group: handoff
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  checks: read
  # To dispatch ci.yml after pushing; see the last step.
  actions: write

jobs:
  regenerate:
    name: Refresh the handoff status block
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the default branch: on a pull_request_target event the ref is the
      # base, but being explicit keeps the commit target unambiguous.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history, so a retry can move to whatever tip it lost the race to.
          fetch-depth: 0

      - name: Regenerate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/gen-handoff-status.sh

      # The commit goes through the GraphQL API, not git push: develop and main
      # require signed commits, and GitHub signs what createCommitOnBranch
      # creates, while a commit made in the runner and pushed would carry no
      # signature at all.
      - name: Commit if anything changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- HANDOFF.md; then
            echo "Status block already current; nothing to commit."
            exit 0
          fi

          # CONTRIBUTING.md requires a sign-off on every contribution, and a
          # commit landing on the default branch without one would be the
          # first, so it carries the bot's own.
          body="Generated by scripts/gen-handoff-status.sh from the state of ${TARGET_BRANCH} and the open pull requests.

          Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # expectedHeadOid makes the commit fail rather than overwrite a push
          # that landed meanwhile. Losing that race is ordinary here, not a
          # failure: move to the new tip, regenerate, and try again.
          for attempt in 1 2 3 4; do
            head=$(git rev-parse HEAD)
            if jq -n \
                --arg repo "$REPO" --arg branch "$TARGET_BRANCH" --arg head "$head" \
                --arg body "$body" --arg contents "$(base64 -w0 HANDOFF.md)" \
                '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                  variables: {input: {
                    branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                    expectedHeadOid: $head,
                    message: {headline: "docs: refresh the handoff status block", body: $body},
                    fileChanges: {additions: [{path: "HANDOFF.md", contents: $contents}]}
                  }}}' \
                | gh api graphql --input -; then
              echo "Committed."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Commit rejected (attempt $attempt); regenerating on the new tip of ${TARGET_BRANCH}."
            sleep $(( 2 ** attempt ))
            git fetch origin "${TARGET_BRANCH}"
            git reset --hard "origin/${TARGET_BRANCH}"
            scripts/gen-handoff-status.sh
            if git diff --quiet -- HANDOFF.md; then
              echo "Status block already current on the new tip; nothing to commit."
              exit 0
            fi
          done
          echo "::error::Could not commit the refreshed handoff after 4 attempts."
          exit 1

      # The commit just pushed is now the branch tip, and the head of the
      # release pull request. Pushed with GITHUB_TOKEN, it triggers no workflow,
      # so without this the tip carries no checks and the release pull request
      # shows none. Dispatching CI on the branch attaches them to that commit.
      - name: Run CI on the new tip
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ github.event.repository.default_branch }}" --repo "${{ github.repository }}"
