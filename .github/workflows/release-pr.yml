name: Release PR (develop → main)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Full history: the commit log is computed locally, and both main and
      # develop have to be there. No credentials stay on disk; the pull
      # request is written through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Headed by develop and merged with a merge commit; the script says why.
      - name: Create or update the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVIEWER: mendsec
        run: scripts/release-pr.sh
