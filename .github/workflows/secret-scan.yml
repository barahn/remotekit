name: Secret Scan

# A credential committed to a repository two products are built from leaks into
# both. gitleaks runs as the upstream binary through `go run` rather than its
# GitHub Action: the Action needs a paid licence key for organisation accounts,
# the binary is MIT and needs nothing.
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  schedule:
    # Rules improve without the code changing. Mondays 05:41 UTC, off the hour.
    - cron: '41 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # The runner's cached 1.26 can trail the latest patch, and govulncheck
          # fails on every standard-library fix it is missing.
          check-latest: true

      # On a pull request, only what the pull request adds: a finding already
      # on the base branch is not this change's to fix.
      - name: Scan commits (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner --exit-code 1 .

      - name: Scan working tree and history
        if: github.event_name != 'pull_request'
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 dir . \
            --redact --no-banner --exit-code 1
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 git \
            --redact --no-banner --exit-code 1 .
