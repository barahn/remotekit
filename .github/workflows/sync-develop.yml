name: Sync develop after merge

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: sync-develop
  cancel-in-progress: false

permissions: {}

jobs:
  sync-develop:
    # main only takes develop, and it has to be this repository's own
    # develop, not a fork's branch of the same name.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # To dispatch ci.yml after pushing; see the last step.
      actions: write
    steps:
      # Only for the script: it reads history through the API, not from here.
      # The commit is the one main just received, so the script is the
      # version that was released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      # Through the REST API, not git push: develop requires signed commits,
      # and GitHub signs the merge it creates there when the fast-forward is
      # refused; the script says when.
      - name: Sync develop with main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: scripts/sync-develop.sh

      # develop's new tip, fast-forwarded or merged, was moved with
      # GITHUB_TOKEN, it triggers no workflow, so CI is dispatched explicitly
      # rather than leaving the tip without checks.
      - name: Run CI on the new tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref develop --repo "${{ github.repository }}"
