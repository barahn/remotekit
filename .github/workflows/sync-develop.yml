name: Sync develop after merge

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: sync-develop
  cancel-in-progress: false

permissions: {}

jobs:
  sync-develop:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # To dispatch ci.yml after pushing; see the last step.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync develop with main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout develop
          git merge origin/main --no-edit
          git push origin develop

      # The merge commit just pushed is develop's new tip. Pushed with
      # GITHUB_TOKEN, it triggers no workflow, so CI is dispatched explicitly
      # rather than leaving the tip without checks.
      - name: Run CI on the new tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref develop --repo "${{ github.repository }}"
