name: SBOM

# A software bill of materials for each release, attached to it. remotekit is a
# library that two products ship; the SBOM is what lets either of them -- or
# anyone downstream -- answer "does this release contain X" without rebuilding
# it.
on:
  push:
    tags: [ 'v*.*.*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SPDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the SBOM to the release
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Populate the module graph
        run: go mod download

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: remotekit-sbom.spdx.json
          output-file: remotekit-sbom.spdx.json
          upload-release-assets: true
