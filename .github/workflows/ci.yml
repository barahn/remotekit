name: CI

on:
  # develop is the integration branch and main the release branch, so both
  # have to be covered: work lands on develop through pull requests long before
  # it reaches main.
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  # A push made with GITHUB_TOKEN triggers no workflow, so a commit a workflow
  # pushes -- the handoff refresh, the develop sync -- would otherwise leave the
  # branch tip, and the release pull request whose head it is, with no checks.
  # Those workflows dispatch this one explicitly; the exemption for
  # workflow_dispatch is what makes that possible.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege by default. This workflow only reads the repository; nothing
# here writes, so nothing here gets a write token. A job that ever needs more
# asks for it by name.
permissions:
  contents: read

jobs:
  test:
    name: Build, Test & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Audit mode: harden-runner records what the job talks to without
      # blocking it. Read its egress report on a few green runs before turning
      # it to `block` with an allowlist -- this job downloads Firefox,
      # geckodriver and libvpx tools, so a blind switch breaks it outright. An
      # observer must not be able to fail the build it observes, hence
      # continue-on-error.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the DCO commit range have to be local, and nothing is
          # fetched later: persist-credentials is false, so a fetch would
          # prompt for a username and hang the step.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      # CONTRIBUTING.md requires a DCO Signed-off-by trailer on every commit.
      # Merge commits are exempt: they carry no contribution of their own.
      - name: Validate DCO Sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Base commit $BASE_SHA is not available locally."
            exit 1
          fi

          MISSING=0
          while read -r sha || [ -n "$sha" ]; do
            [ -z "$sha" ] && continue
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
              echo "✓ $sha is signed off."
            else
              echo "::error::Commit $sha has no 'Signed-off-by' trailer: $(git show -s --format='%s' "$sha")"
              MISSING=1
            fi
          done < <(git log --no-merges "${BASE_SHA}..${HEAD_SHA:-HEAD}" --pretty=format:"%H")

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::DCO validation failed. Sign your commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "✓ All commits carry a DCO sign-off."

      # Apache-2.0 section 4(d) makes NOTICE binding on redistributors, so a
      # vendored dependency losing its attribution is a licence breach, not a
      # documentation lapse. The VP8 encoder is the entry that matters today.
      - name: NOTICE covers vendored third-party code
        run: |
          missing=0
          while read -r f; do
            # Repository-relative, because that is how NOTICE spells the paths.
            dir=$(dirname "${f#./}")
            if ! grep -qF "$dir" NOTICE; then
              echo "::error::$f has no matching entry in NOTICE"
              missing=1
            fi
          done < <(find . -name 'LICENSE.upstream' -not -path './.git/*')
          [ "$missing" -eq 0 ] && echo "✓ every vendored tree is named in NOTICE"
          exit "$missing"

      # CONTRIBUTING.md allows only permissive dependencies. The NOTICE check
      # above covers vendored code; this covers modules. A copyleft dependency
      # would make remotekit unusable by one or both of the projects it exists
      # to serve, and nothing else in CI would fail: the build works, the tests
      # pass. Checked per OS because capture, input and tray are per-platform.
      #
      # GOROOT and GOTOOLCHAIN are pinned so go-licenses resolves the standard
      # library from the same toolchain that builds it; with a mismatch it fails
      # on the standard library rather than on a licence.
      #
      # KNOWN EXCEPTION -- github.com/hashicorp/yamux is MPL-2.0, which the
      # policy in CONTRIBUTING.md does not list. It predates this gate and is
      # what tunnel multiplexes over. It is excepted by name so that the gate
      # catches every *new* copyleft dependency; whether to accept MPL-2.0
      # formally or replace yamux is the maintainer's decision, recorded in
      # docs/devsecops.md. Do not add a second name to this list without that
      # same decision.
      - name: Dependency licences are permissive
        run: |
          export GOROOT="$(go env GOROOT)" GOTOOLCHAIN=local
          go install github.com/google/go-licenses@v1.6.0
          status=0
          for os in linux windows darwin; do
            echo "::group::$os"
            if ! GOOS="$os" "$(go env GOPATH)/bin/go-licenses" check \
                --disallowed_types=forbidden,restricted,reciprocal,unknown \
                --ignore github.com/hashicorp/yamux \
                ./...; then
              echo "::error::a dependency built for $os has a licence the policy does not allow"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Build & Vet
        run: |
          go build ./...
          go vet ./...

      # Capture, input and tray are per-platform implementations that Linux-only
      # compilation never touches. Cross-compiling costs seconds and stops a
      # syntax error on the Windows or macOS paths from passing green.
      - name: Cross-compile Check (Windows / macOS)
        env:
          CGO_ENABLED: 0
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-mode: goinstall
          skip-cache: true

      # screen and input guard their capture and injection tests on DISPLAY and
      # skip without one. A virtual framebuffer executes them. This covers the
      # X11 paths; it does not cover Wayland, whose portal and PipeWire
      # negotiation a framebuffer cannot stand in for.
      - name: Install Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb

      # The VP8 conformance oracle shells out to libvpx's reference decoder to
      # check that encoder output is a bitstream a real decoder accepts.
      # golang.org/x/image/vp8 cannot stand in for it: that decoder handles key
      # frames only, so it cannot see the inter-frame path at all. libvpx runs
      # as a test-time subprocess and is never linked in, so the zero-CGo
      # premise is untouched.
      - name: Install libvpx tools (VP8 conformance oracle)
        run: sudo apt-get install -y --no-install-recommends vpx-tools

      # TestFirefoxDecodesTheStream drives a real Firefox through geckodriver
      # and is the only test that proves a browser can decode what this
      # encoder produces. Unit tests cannot: they compare our output against
      # our own expectations.
      #
      # Firefox is installed from Mozilla's tarball rather than apt. On current
      # Ubuntu the apt `firefox` package is a transition stub that pulls in
      # snapd, which does not work on a GitHub-hosted runner. The tarball is
      # self-contained and needs no display -- the test passes `-headless`.
      #
      # Both are skipped when the image already carries them, so this costs
      # nothing on runners that do.
      - name: Install Firefox and geckodriver (browser decode test)
        run: |
          if ! command -v firefox >/dev/null 2>&1; then
            curl -fsSL -o /tmp/firefox.tar.xz \
              "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
            sudo tar -xJf /tmp/firefox.tar.xz -C /opt
            sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox
          fi
          if ! command -v geckodriver >/dev/null 2>&1; then
            GD=v0.36.0
            curl -fsSL -o /tmp/geckodriver.tar.gz \
              "https://github.com/mozilla/geckodriver/releases/download/${GD}/geckodriver-${GD}-linux64.tar.gz"
            sudo tar -xzf /tmp/geckodriver.tar.gz -C /usr/local/bin
          fi
          firefox --version
          geckodriver --version | head -1

      - name: Test
        env:
          # Without this TestFirefoxDecodesTheStream skips even where firefox
          # and geckodriver are present, which is how it sat unnoticed outside
          # the pipeline. The step above guarantees both exist, so a skip here
          # now means something is wrong rather than something is missing.
          BARAHN_BROWSER_TEST: '1'
          # Turns a missing vpxdec into a test failure instead of a skip. A
          # conformance gate that silently skips is how an encoder ends up with
          # an inter-frame path no test ever decoded.
          VP8_CONFORMANCE_REQUIRED: '1'
        # Go's default is 10 minutes per package, and screen/codec/vp8 now
        # exceeds it: the rate-control test drives a second of scrolling 720p
        # through the encoder twice, and under -race with coverage
        # instrumentation that alone is five minutes -- before the conformance
        # sweep across seven quantisers and the soak run in the same package.
        # barahn/barahn runs the same test inside the default and fits only
        # because it has no vpxdec, so everything that needs the oracle skips.
        run: xvfb-run -a go test -race -timeout 30m -coverprofile=coverage.out ./...

      # screen/codec/vp8 is excluded for its 53 deliberate int->int16 narrowings
      # in the forward DCT and quantiser, where the VP8 spec bounds the values by
      # construction. Annotating them with 53 #nosec comments would destroy the
      # baseline the fork needs to diff against upstream.
      - name: SAST (gosec)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.1 -exclude-dir=screen/codec/vp8 ./...

      - name: Vulnerability Check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
